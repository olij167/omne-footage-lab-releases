name: Build native Footage Lab release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; must match app_source/omne_footage_lab.py"
        required: true
        default: "0.3.2"
      publish_release:
        description: "Create immutable public GitHub Release after all native builds pass"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: footage-lab-native-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('app_source/omne_footage_lab.py')
          t=ast.parse(p.read_text(encoding='utf-8'))
          print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='VERSION' for x in n.targets)))
          PY
          )"
          test "$SOURCE_VERSION" = "${{ inputs.version }}" || {
            echo "Requested v${{ inputs.version }} but source is v$SOURCE_VERSION" >&2
            exit 2
          }
          echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: validate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app_source
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg + Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install innosetup -y --no-progress
      - name: Optional Authenticode certificate
        if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP 'omne-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $secure = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert) { throw 'Certificate import failed' }
          "OMNE_WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Windows x64
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          if-no-files-found: error
          path: |
            app_source/dist-installer/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_Windows_x64_Setup.exe
            app_source/dist-installer/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_Windows_x64_Setup.exe.sha256
            app_source/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_Windows_x64_Portable.zip
            app_source/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_Windows_x64_Portable.zip.sha256

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app_source
    env:
      MACOS_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_APP_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg
        shell: bash
        run: brew install ffmpeg
      - name: Optional Developer ID certificates
        if: ${{ env.MACOS_P12_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/omne-build.keychain-db"
          echo "$MACOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/omne-signing.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/omne-signing.p12" -P "$MACOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "OMNE_MACOS_APPLICATION_IDENTITY=$MACOS_APP_IDENTITY" >> "$GITHUB_ENV"
          echo "OMNE_MACOS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
      - name: Build macOS ${{ matrix.arch }}
        shell: bash
        env:
          OMNE_APPLE_ID: ${{ secrets.APPLE_ID }}
          OMNE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OMNE_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./build_macos.sh
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            app_source/dist-macos/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_macOS_${{ matrix.arch }}.pkg
            app_source/dist-macos/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_macOS_${{ matrix.arch }}.pkg.sha256
            app_source/dist-macos/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_macOS_${{ matrix.arch }}.dmg
            app_source/dist-macos/OmN-e_Footage_Lab_v${{ needs.validate.outputs.version }}_macOS_${{ matrix.arch }}.dmg.sha256

  github-release:
    if: ${{ inputs.publish_release }}
    needs: [validate, windows-x64, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists. Versions are immutable." >&2
            exit 2
          fi
      - name: Create public native release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          gh release create "v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OmN-e Footage Lab v$VERSION — native desktop builds" \
            --notes "Native Windows and macOS builds for OmN-e Footage Lab v$VERSION. The canonical download page and update authority remain on https://omne.space/downloads/footage-lab/."
